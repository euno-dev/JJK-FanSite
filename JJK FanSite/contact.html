<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JJK Fan Site — Contact</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/script.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Contact / Feedback</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="characters.html">Characters</a>
      <a href="episodes.html">Episodes</a>
      <a href="gallery.html">Gallery</a>
      <a href="villains.html">Villains</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <h2>Contact the Fan Team</h2>
    <form id="contactForm" class="contact-form">
      <label>Name
        <input type="text" id="name" name="name" required>
      </label>
      <label>Email
        <input type="email" id="email" name="email" required>
      </label>
      <label>Message
        <textarea id="message" name="message" rows="5" required></textarea>
      </label>
      <button type="submit" class="btn">Send</button>
    </form>

    <div id="thankYou" class="thank-you" aria-hidden="true">
      <p>Thank you! Your message has been received.</p>
    </div>
  </main>

  <footer>
    <p>© 2025 JJK Fan Site — Student Project (fan-made)</p>
  </footer>
</body>
</html>
